# N4 Monitor frontend - Nginx server config
# Serves the Vue SPA and reverse-proxies /api and /ws to the backend container.
#
# NOTE: this file is a template. The Docker image renders it via envsubst at
# container start (see frontend/Dockerfile + nginx /etc/nginx/templates), so
# ${BACKEND_PORT} resolves to the backend port (default 8088, overridable via
# SERVER_PORT in .env). Do not hardcode the port here - edit SERVER_PORT once.

server {
    listen       80;
    server_name  _;

    # SPA static assets
    root   /usr/share/nginx/html;
    index  index.html;

    # Gzip for text-based assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml text/xml image/svg+xml;
    gzip_min_length 1024;

    # Reverse proxy for REST API -> backend. Host network mode: backend shares
    # the host network stack, so loopback reaches it directly (no compose
    # service-name DNS available in host mode).
    location /api/ {
        proxy_pass http://127.0.0.1:${BACKEND_PORT};
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Reverse proxy for WebSocket -> backend (host network, loopback)
    location /ws {
        proxy_pass http://127.0.0.1:${BACKEND_PORT};
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Keep WebSocket connections alive across idle periods
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Vue Router history mode: fall back to index.html for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long cache for hashed build assets
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
