# N4 Monitor frontend - Nginx server config
# Serves the Vue SPA and reverse-proxies /api and /ws to the backend container.

server {
    listen       80;
    server_name  _;

    # SPA static assets
    root   /usr/share/nginx/html;
    index  index.html;

    # Gzip for text-based assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml text/xml image/svg+xml;
    gzip_min_length 1024;

    # Reverse proxy for REST API -> backend container (compose service name)
    location /api/ {
        proxy_pass http://n4-monitor-backend:8089;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Reverse proxy for WebSocket -> backend container
    location /ws {
        proxy_pass http://n4-monitor-backend:8089;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Keep WebSocket connections alive across idle periods
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Vue Router history mode: fall back to index.html for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long cache for hashed build assets
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
