server:
  port: ${SERVER_PORT:8088}


spring:
  application:
    name: n4-monitor
  # Optional per-environment overrides from a local .env file (KEY=VALUE,
  # properties syntax). .env values win over the defaults below; OS environment
  # variables still win over both. Copy .env.example to .env and fill in real
  # endpoints/credentials. Note: .env is gitignored (never committed) - create
  # it locally on each machine.
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]

  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/n4_monitor?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.n4monitor.entity,com.n4monitor.device.entity,com.n4monitor.product.entity,com.n4monitor.template.entity,com.n4monitor.deployment.entity,com.n4monitor.dashboard.entity,com.n4monitor.fuxa.entity
  configuration:
    map-underscore-to-camel-case: true

# TDengine configuration (REST mode, port 6041). WebSocket mode (jdbc:TAOS-WS://)
# is available by changing the URL only - measured slower for this project's
# batched-statement workload (WS fetch protocol adds a round trip per query);
# revisit together with a STMT2 prepared-statement migration.
tdengine:
  url: ${TDENGINE_URL:jdbc:TAOS-RS://localhost:6041/n4}
  username: ${TDENGINE_USERNAME:root}
  password: ${TDENGINE_PASSWORD:}
  database: n4
  realtime-supertable: alarm_realtime
  event-supertable: alarm_event
  # History queries order by the write timestamp and prune to this recent
  # window (days) instead of scanning the full KEEP range; 0 disables the filter.
  query-window-days: 7

# Alarm configuration
alarm:
  flink:
    # Master switch for the embedded alarm-processing job. Set
    # ALARM_FLINK_ENABLED=false in .env for local development that does not
    # touch the alarm pipeline: the backend then skips the job entirely
    # (no Kafka connection, no rule evaluation); MySQL CRUD, templates, nav
    # and FUXA keep working. Docker compose pins it to "true" for deployments.
    enabled: ${ALARM_FLINK_ENABLED:true}
    # Kafka topic consumed by the embedded job. Override via ALARM_FLINK_TOPIC
    # in .env (e.g. kafka-test for the manual test producer). Keep in sync with
    # the EMQX bridge target and the standalone cluster's --kafka-topic.
    topic: ${ALARM_FLINK_TOPIC:mqtt-push-kafka}
    group-id: n4-flink-alarm-processor
    parallelism: ${ALARM_FLINK_PARALLELISM:4} # Parallel alarm tasks; embedded mode and the standalone cluster share ALARM_FLINK_PARALLELISM. Must be <= min(CPU cores, Kafka topic partitions). keyBy(path) routes same-path messages to one task so concurrent tasks never race on alarm:active state.
    point-meta-cache-ttl-seconds: 60 # Local per-subtask TTL cache for point metadata (alarm:point:rule entries). Raise to reduce Redis reads on stable deployments; rule/deployment edits take effect within one TTL window.
    rule-cache-ttl-seconds: 60 # Local per-subtask TTL cache for numeric/enum rule objects. Rule edits take effect within one TTL window without a job restart.
  # Redis keys, channels and streams used by alarm processing
  redis:
    rules-numeric-key: alarm:rules:numeric       # Numeric rules hash (field=alarm_name, value=NumericEntity JSON)
    rules-enum-key: alarm:rules:enum             # Enum rules hash (field=alarm_name, value=List<EnumEntity> JSON, includes former boolean rules)
    latest-key: alarm:latest                     # Real-time point values (overwritten per data tick, for live display + ack override)
    active-key: alarm:active                     # Alarm records + ack status
    notification-channel: alarm:notifications    # WebSocket notification channel (ephemeral Pub/Sub push; loss during a backend restart is acceptable)
    realtime-stream: alarm:stream:realtime       # TDengine realtime persistence stream (alarm lifecycle events; consumer group, ack after write, replayable)
    persistence-stream: alarm:stream:persist     # TDengine full-detail persistence stream (every processed frame; consumer group, ack after write, replayable)
    realtime-stream-maxlen: 100000               # Approximate MAXLEN trim for the realtime stream (~hours of alarm lifecycle records during a backend outage)
    persistence-stream-maxlen: 1000000           # Approximate MAXLEN trim for the persist stream (~hours of frames during a backend outage; oldest entries evicted beyond the cap)
    stream-group: n4-backend                     # Consumer group on both persistence streams
    stream-consumer: n4-backend                  # Fixed consumer name: restart recovery replays this consumer's own PEL (single-instance deployments only)
    point-rule-map-key: alarm:point:rule         # Point path -> metadata map (Hash, field=path, value=JSON {"type","alarm_code"})

  # Event page Excel export
  export:
    max-rows: 50000                              # Data rows per export; larger ranges are rejected with a 400, never truncated
    page-size: 5000                              # Rows per TDengine page read while exporting (REST driver buffers whole result sets)

# Dynamic FUXA template binding. Secrets remain in FUXA's MQTT device configuration.
fuxa:
  base-url: ${FUXA_BASE_URL:http://localhost:1881}
  enabled: ${FUXA_ENABLED:true}
  cabin-idle-shutdown-delay-seconds: ${FUXA_CABIN_IDLE_SHUTDOWN_DELAY_SECONDS:60}

# JWT security configuration
jwt:
  secret: ${JWT_SECRET:N4MonitorJwtSecretKeyMustBeLongEnoughForHmacSha256Algorithm2026!}
  expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}

# Default administrator credentials initialization
admin:
  default-password: ${ADMIN_DEFAULT_PASSWORD:admin123}

# Logging is configured in logback-spring.xml (console + rolling file output).
