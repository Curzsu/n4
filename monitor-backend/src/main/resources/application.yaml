server:
  port: ${SERVER_PORT:8088}


spring:
  application:
    name: n4-monitor
  # Optional per-environment overrides from a local .env file (KEY=VALUE,
  # properties syntax). .env values win over the defaults below; OS environment
  # variables still win over both. Copy .env.example to .env and fill in real
  # endpoints/credentials. Note: .env is currently tracked in this private
  # self-hosted repo; untrack it and rotate credentials before wider sharing.
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]

  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/n4_monitor?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.n4monitor.entity,com.n4monitor.device.entity,com.n4monitor.product.entity,com.n4monitor.template.entity,com.n4monitor.deployment.entity,com.n4monitor.dashboard.entity,com.n4monitor.fuxa.entity
  configuration:
    map-underscore-to-camel-case: true

# TDengine configuration (REST mode, port 6041)
tdengine:
  url: ${TDENGINE_URL:jdbc:TAOS-RS://localhost:6041/n4}
  username: ${TDENGINE_USERNAME:root}
  password: ${TDENGINE_PASSWORD:}
  database: n4
  realtime-supertable: alarm_realtime
  event-supertable: alarm_event
  # Batch flush interval for full-detail event persistence (alarm_event)
  event-flush-rate-ms: 1000 # Drain buffered frames into alarm_event every second.
  event-flush-initial-delay-ms: 3000 # Initial delay before the first flush.

# Alarm configuration
alarm:
  flink:
    enabled: true
    topic: mqtt-push-kafka
    # topic: kafka-test
    group-id: n4-flink-alarm-processor
    parallelism: 4 # Parallel alarm tasks. Must be <= min(CPU cores, Kafka topic partitions). keyBy(path) routes same-path messages to one task so concurrent tasks never race on alarm:active state.
  # Redis keys and channels used by alarm processing
  redis:
    rules-numeric-key: alarm:rules:numeric       # Numeric rules hash (field=alarm_name, value=NumericEntity JSON)
    rules-enum-key: alarm:rules:enum             # Enum rules hash (field=alarm_name, value=List<EnumEntity> JSON, includes former boolean rules)
    latest-key: alarm:latest                     # Real-time point values (overwritten per data tick, for live display + ack override)
    active-key: alarm:active                     # Alarm records + ack status
    notification-channel: alarm:notifications    # WebSocket notification channel
    realtime-channel: alarm:realtime             # TDengine realtime persistence channel (alarm lifecycle events only)
    persistence-channel: alarm:persist           # TDengine full-detail persistence channel (every processed frame)
    point-rule-map-key: alarm:point:rule         # Point path -> metadata map (Hash, field=path, value=JSON {"type","alarm_code"})

# Dynamic FUXA template binding. Secrets remain in FUXA's MQTT device configuration.
fuxa:
  base-url: ${FUXA_BASE_URL:http://localhost:1881}
  enabled: ${FUXA_ENABLED:true}
  cabin-idle-shutdown-delay-seconds: ${FUXA_CABIN_IDLE_SHUTDOWN_DELAY_SECONDS:60}
  # One preconfigured FUXA MQTT client represents one cabin. Keep that client
  # disabled in FUXA; the N4 monitor opens it on demand before loading the iframe.
  # cabin-clients:
  #   A1-MVP-A1:
  #     device-id: d_replace_with_the_fuxa_mqtt_device_id
  #     device-name: CABIN_A1_MVP_A1
  #     view-name: A1_MVP_A1_CABIN_OVERVIEW
  cabin-clients:
    A1_MVP_A1:                       # 当前 N4 导航树中的方舱节点名称
      device-name: A1_MVP_A1
      view-name: N4_CABIN_RUNTIME_HOST
      template-view-name: A1_MVP_A1_CABIN_OVERVIEW
      view-width: 1780
      view-height: 980
    A1_MVP_B1:                       # 当前 N4 导航树中的方舱节点名称
      device-name: A1_MVP_B1
      view-name: N4_CABIN_RUNTIME_HOST
      template-view-name: A1_MVP_B1_CABIN_OVERVIEW
      view-width: 1728
      view-height: 980
    J1_LVP_A1:                       # N4 前端树里的方舱名称
      device-name: A1_MVP_A1
      view-name: N4_CABIN_RUNTIME_HOST
      template-view-name: A1_MVP_A1_CABIN_OVERVIEW
      view-width: 1780
      view-height: 980

# Logging is configured in logback-spring.xml (console + rolling file output).
