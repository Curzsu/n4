server:
  port: 8089

spring:
  application:
    name: n4-monitor

  datasource:
    url: jdbc:mysql://47.121.30.136:3306/n4_monitor?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    password: Password@mysql
    driver-class-name: com.mysql.cj.jdbc.Driver

  kafka:
    bootstrap-servers: 47.121.30.136:9092

  data:
    redis:
      host: 47.121.30.136
      port: 6379
      password: Password@redis

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.n4monitor.entity
  configuration:
    map-underscore-to-camel-case: true

# TDengine configuration (REST mode, port 6041)
tdengine:
  url: jdbc:TAOS-RS://47.121.30.136:6041/n4
  username: root
  password: taosdata
  database: n4
  supertable: alarm
  realtime-supertable: alarm_realtime
  # Periodic snapshot sync interval from Redis to TDengine
  sync-fixed-rate-ms: 5000 # The time interval for storing the latest status of the location points.
  sync-initial-delay-ms: 15000 # The initial execution delay time of the scheduled synchronization task

# Alarm configuration
alarm:
  flink:
    enabled: true
    topic: obix-mqtt-points
    group-id: n4-flink-alarm-processor
    parallelism: 4 # Parallel alarm tasks. Must be <= min(CPU cores, Kafka topic partitions). keyBy(path) routes same-path messages to one task so concurrent tasks never race on alarm:active state.
  # Redis keys and channels used by alarm processing
  redis:
    rules-numeric-key: alarm:rules:numeric       # Numeric rules hash (field=alarm_name, value=NumericEntity JSON)
    rules-enum-key: alarm:rules:enum             # Enum rules hash (field=alarm_name, value=List<EnumEntity> JSON, includes former boolean rules)
    latest-key: alarm:latest                     # Real-time point values (overwritten per data tick, for TDengine sync and charts)
    active-key: alarm:active                     # Alarm records + ack status
    notification-channel: alarm:notifications    # WebSocket notification channel
    realtime-channel: alarm:realtime             # TDengine realtime persistence channel
    point-rule-map-key: alarm:point:rule         # Point path -> metadata map (Hash, field=path, value=JSON {"type","alarm_code"})

# Dynamic FUXA template binding. Secrets remain in FUXA's MQTT device configuration.
fuxa:
  base-url: ${FUXA_BASE_URL:http://127.0.0.1:1881}
  enabled: ${FUXA_PROVISIONING_ENABLED:true}
  template-device-id: ${FUXA_TEMPLATE_DEVICE_ID:d_f1431d5e-58774643}
  template-topic-device-id: ${FUXA_TEMPLATE_TOPIC_DEVICE_ID:EMSB_03_EM32}
  template-view-id: ${FUXA_TEMPLATE_VIEW_ID:v_h1_emsb_a4_03_em}
  template-view-name: ${FUXA_TEMPLATE_VIEW_NAME:H1_EMSB_A4_03_EM}
  adapter-id: ${FUXA_ADAPTER_ID:d_n4_spm32_adapter}
  adapter-name: ${FUXA_ADAPTER_NAME:N4 SPM32 Adapter}

logging:
  level:
    org.apache.flink: WARN
    org.apache.kafka: WARN
    org.apache.pekko: WARN
