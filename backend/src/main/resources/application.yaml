server:
  port: 8089

spring:
  application:
    name: n4-monitor

  datasource:
    url: jdbc:mysql://localhost:3306/n4_monitor?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  kafka:
    bootstrap-servers: 47.121.30.136:9092

  data:
    redis:
      host: localhost
      port: 6379

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.n4monitor.entity
  configuration:
    map-underscore-to-camel-case: true

# TDengine configuration (REST mode, port 6041)
tdengine:
  url: jdbc:TAOS-RS://47.121.30.136:6041/n4
  username: root
  password: taosdata
  database: n4
  supertable: alarm
  realtime-supertable: alarm_realtime
  # Periodic snapshot sync interval from Redis to TDengine
  sync-fixed-rate-ms: 5000 # The time interval for storing the latest status of the location points.
  sync-initial-delay-ms: 15000 # The initial execution delay time of the scheduled synchronization task

# Alarm configuration
alarm:
  rule:
    excel-file: D:/Apro/N4-monitor/材料/alarm_rules_config.xlsx
    log-file: D:/Apro/N4-monitor/材料/points-2.log
  flink:
    enabled: true
#    topic: mqtt-push-kafka
    topic: obix-mqtt-points
    group-id: n4-flink-alarm-processor
  # Redis keys and channels used by alarm processing
  redis:
    rules-key: alarm:rules
    latest-key: alarm:latest                  # Real-time point values (each piece of data is overwritten, for TDengine synchronization and charts)
    active-key: alarm:active                  # Alarm records + ack status (written when alarm is triggered, frozen/deleted when recovered, status updated when Acked)
    notification-channel: alarm:notifications # Queue for sending alarm notifications
    realtime-channel: alarm:realtime          # Queue for writing to TDengine database

