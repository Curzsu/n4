name: n4-lab
services:
  mysql:
    image: mysql:8.4.5
    restart: unless-stopped
    ports: ["127.0.0.1:23306:3306"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:?Local password required}
      MYSQL_DATABASE: n4_monitor
      TZ: Asia/Shanghai
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 1g
  redis:
    image: redis:7.4.10-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:16379:6379"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Local password required}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 256m
  neo4j:
    image: neo4j:5.26.29
    restart: unless-stopped
    ports: ["127.0.0.1:17474:7474", "127.0.0.1:17687:7687"]
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:?Local authentication required}
      NEO4J_server_bolt_advertised__address: localhost:17687
      NEO4J_server_http_advertised__address: localhost:17474
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes: [neo4j-data:/data, neo4j-logs:/logs]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 30
    mem_limit: 1536m
volumes:
  mysql-data:
  redis-data:
  neo4j-data:
  neo4j-logs:
